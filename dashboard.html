<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Keuangan - Unlimited</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f1f5f9;min-height:100vh}
header{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:20px 16px;position:sticky;top:0;z-index:10}
.top{display:flex;justify-content:space-between;align-items:center;max-width:900px;margin:0 auto}
.container{max-width:900px;margin:20px auto;padding:0 16px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 4px 12px rgba(0,0,0,.06)}
.card h3{font-size:14px;color:#64748b;margin-bottom:6px}
.card .val{font-size:24px;font-weight:700}
.in{color:#16a34a}.out{color:#dc2626}.bal{color:#2563eb}
.menu{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:20px}
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;border:none;border-radius:16px;padding:24px 16px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.06);transition:.2s;font-size:15px;font-weight:600;color:#1e293b;text-decoration:none}
.btn:hover{transform:translateY(-3px)}
.btn span{font-size:32px;margin-bottom:8px}
.panel{background:#fff;border-radius:16px;padding:18px;box-shadow:0 4px 12px rgba(0,0,0,.06);display:none}
.panel.active{display:block}
.row{display:flex;gap:8px;margin-bottom:10px}
input,select{flex:1;height:42px;padding:0 12px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:14px;background:#f8fafc}
.add{height:42px;padding:0 16px;background:#667eea;color:#fff;border:none;border-radius:10px;font-weight:600;cursor:pointer}
.list{margin-top:14px;max-height:400px;overflow:auto}
.item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f1f5f9;font-size:14px}
.logout{margin:30px auto;display:block;background:none;border:none;color:#64748b;text-decoration:underline;font-size:13px;cursor:pointer}
</style>
</head>
<body>
<header><div class="top"><div><h2 id="hi">Halo!</h2><p style="font-size:13px;opacity:.9">Pantau keuangan real-time</p></div><div style="text-align:right"><div class="time" id="time" style="font-size:24px;font-weight:700">00:00:00</div><div class="date" id="date" style="font-size:12px;opacity:.9">-</div></div></div></header>
<div class="container">
<div class="cards"><div class="card"><h3>💰 Masuk</h3><div class="val in" id="tIn">Rp 0</div></div><div class="card"><h3>💸 Keluar</h3><div class="val out" id="tOut">Rp 0</div></div><div class="card" style="grid-column:1/-1"><h3>Saldo</h3><div class="val bal" id="tBal">Rp 0</div></div></div>
<div class="menu">
<button class="btn" onclick="openPanel('in')"><span>💰</span>Uang Masuk</button>
<button class="btn" onclick="openPanel('out')"><span>💸</span>Uang Keluar</button>
<a class="btn" href="ruang-data.html"><span>📁</span>Ruang Data Khusus<br><small style="font-size:11px;color:#667eea;font-weight:600">Buka Layar Baru →</small></a>
</div>
<div id="pIn" class="panel"><h4>Catat Uang Masuk</h4><div class="row"><input id="inAmt" type="number" placeholder="Jumlah"><input id="inDesc" placeholder="Keterangan"></div><div class="row"><select id="inCat"><option>Gaji</option><option>Bonus</option><option>Usaha</option><option>Lainnya</option></select><button class="add" onclick="addTx('in')">Tambah</button></div><div class="list" id="lIn"></div></div>
<div id="pOut" class="panel"><h4>Catat Uang Keluar</h4><div class="row"><input id="outAmt" type="number" placeholder="Jumlah"><input id="outDesc" placeholder="Keterangan"></div><div class="row"><select id="outCat"><option>Makan</option><option>Transport</option><option>Belanja</option><option>Tagihan</option><option>Lainnya</option></select><button class="add" onclick="addTx('out')">Tambah</button></div><div class="list" id="lOut"></div></div>
<button class="logout" onclick="localStorage.clear();location.href='index.html'">Keluar</button>
</div>
<script>
function tick(){const n=new Date();document.getElementById('time').textContent=n.toLocaleTimeString('id-ID',{hour12:false});document.getElementById('date').textContent=n.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}setInterval(tick,1000);tick();
const nama=localStorage.getItem('nama')||'muhammad gibran';document.getElementById('hi').textContent='Halo, '+nama+'!';
let data=JSON.parse(localStorage.getItem('keuangan')||'{"in":[],"out":[]}');
function save(){localStorage.setItem('keuangan',JSON.stringify(data));render();}
function fmt(n){return 'Rp '+Number(n).toLocaleString('id-ID')}
function render(){const tIn=data.in.reduce((a,b)=>a+b.amt,0),tOut=data.out.reduce((a,b)=>a+b.amt,0);document.getElementById('tIn').textContent=fmt(tIn);document.getElementById('tOut').textContent=fmt(tOut);document.getElementById('tBal').textContent=fmt(tIn-tOut);document.getElementById('lIn').innerHTML=data.in.map(x=>`<div class="item"><span>${x.desc}</span><b class="in">+${fmt(x.amt)}</b></div>`).reverse().join('');document.getElementById('lOut').innerHTML=data.out.map(x=>`<div class="item"><span>${x.desc}</span><b class="out">-${fmt(x.amt)}</b></div>`).reverse().join('');}
function openPanel(t){document.getElementById('pIn').classList.toggle('active',t==='in');document.getElementById('pOut').classList.toggle('active',t==='out');}
function addTx(t){const amt=Number(document.getElementById(t==='in'?'inAmt':'outAmt').value),desc=document.getElementById(t==='in'?'inDesc':'outDesc').value||'-';if(!amt)return alert('Masukkan jumlah');const cat=document.getElementById(t==='in'?'inCat':'outCat').value;data[t].push({amt,desc,cat,t:Date.now()});save();document.getElementById(t==='in'?'inAmt':'outAmt').value='';document.getElementById(t==='in'?'inDesc':'outDesc').value='';}
render();
</script>
</body>
</html>
