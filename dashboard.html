<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Keuangan</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f1f5f9;min-height:100vh}
header{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:20px 16px;position:sticky;top:0;z-index:10}
.top{display:flex;justify-content:space-between;align-items:center;max-width:900px;margin:0 auto}
.greet h2{font-size:18px;font-weight:600}
.greet p{font-size:13px;opacity:.9}
.clock{text-align:right}
.clock .time{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:1px}
.clock .date{font-size:12px;opacity:.9}
.container{max-width:900px;margin:20px auto;padding:0 16px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 4px 12px rgba(0,0,0,.06)}
.card h3{font-size:14px;color:#64748b;margin-bottom:6px}
.card .val{font-size:24px;font-weight:700}
.in{color:#16a34a}.out{color:#dc2626}.bal{color:#2563eb}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;border:none;border-radius:16px;padding:24px 16px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.06);transition:.2s;font-size:15px;font-weight:600;color:#1e293b}
.btn:hover{transform:translateY(-2px)}
.btn span{font-size:32px;margin-bottom:8px}
.panel{background:#fff;border-radius:16px;padding:18px;box-shadow:0 4px 12px rgba(0,0,0,.06);display:none}
.panel.active{display:block}
.panel h4{margin-bottom12px;font-size:16px}
.row{display:flex;gap:8px;margin-bottom:10px}
input,select{flex:1;height:42px;padding:0 12px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:14px;background:#f8fafc}
input:focus{outline:none;border-color:#667eea;background:#fff}
.add{height:42px;padding:0 16px;background:#667eea;color:#fff;border:none;border-radius:10px;font-weight:600;cursor:pointer}
.list{margin-top:14px;max-height:240px;overflow:auto}
.item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f1f5f9;font-size:14px}
.item .desc{color:#475569}
.item .amt{font-weight:600}
.logout{margin:30px auto;display:block;background:none;border:none;color:#64748b;text-decoration:underline;font-size:13px;cursor:pointer}
@media(max-width:600px){.cards,.menu{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="greet">
      <h2 id="hi">Halo!</h2>
      <p>Pantau keuangan real-time</p>
    </div>
    <div class="clock">
      <div class="time" id="time">00:00:00</div>
      <div class="date" id="date">-</div>
    </div>
  </div>
</header>

<div class="container">
  <div class="cards">
    <div class="card"><h3>💰 Uang Masuk</h3><div class="val in" id="tIn">Rp 0</div></div>
    <div class="card"><h3>💸 Uang Keluar</h3><div class="val out" id="tOut">Rp 0</div></div>
    <div class="card" style="grid-column:1/-1"><h3>Saldo</h3><div class="val bal" id="tBal">Rp 0</div></div>
  </div>

  <div class="menu">
    <button class="btn" onclick="openPanel('in')"><span>💰</span>Uang Masuk</button>
    <button class="btn" onclick="openPanel('out')"><span>💸</span>Uang Keluar</button>
  </div>

  <div id="pIn" class="panel">
    <h4>Catat Uang Masuk</h4>
    <div class="row">
      <input id="inAmt" type="number" placeholder="Jumlah (Rp)">
      <input id="inDesc" placeholder="Keterangan">
      <button class="add" onclick="addTx('in')">Tambah</button>
    </div>
    <div class="list" id="lIn"></div>
  </div>

  <div id="pOut" class="panel">
    <h4>Catat Uang Keluar</h4>
    <div class="row">
      <input id="outAmt" type="number" placeholder="Jumlah (Rp)">
      <input id="outDesc" placeholder="Keterangan">
      <button class="add" onclick="addTx('out')">Tambah</button>
    </div>
    <div class="list" id="lOut"></div>
  </div>

  <button class="logout" onclick="logout()">Keluar</button>
</div>

<script>
// jam real-time
function tick(){
  const now=new Date();
  document.getElementById('time').textContent = now.toLocaleTimeString('id-ID',{hour12:false});
  document.getElementById('date').textContent = now.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
setInterval(tick,1000); tick();

// cek login
const nama=localStorage.getItem('nama')||localStorage.getItem('wa_nama')||localStorage.getItem('nm');
if(!nama){location.href='index.html'} else {document.getElementById('hi').textContent='Halo, '+nama+'!';}

// data
let data=JSON.parse(localStorage.getItem('keuangan')||'{"in":[],"out":[]}');
function save(){localStorage.setItem('keuangan',JSON.stringify(data));render();}
function fmt(n){return 'Rp '+Number(n).toLocaleString('id-ID')}
function render(){
  const tIn=data.in.reduce((a,b)=>a+b.amt,0);
  const tOut=data.out.reduce((a,b)=>a+b.amt,0);
  document.getElementById('tIn').textContent=fmt(tIn);
  document.getElementById('tOut').textContent=fmt(tOut);
  document.getElementById('tBal').textContent=fmt(tIn-tOut);
  document.getElementById('lIn').innerHTML=data.in.map((x,i)=>`<div class="item"><span class="desc">${x.desc} <small style="color:#94a3b8">${new Date(x.t).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}</small></span><span class="amt in">+${fmt(x.amt)}</span></div>`).reverse().join('');
  document.getElementById('lOut').innerHTML=data.out.map((x,i)=>`<div class="item"><span class="desc">${x.desc} <small style="color:#94a3b8">${new Date(x.t).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}</small></span><span class="amt out">-${fmt(x.amt)}</span></div>`).reverse().join('');
}
function openPanel(t){document.getElementById('pIn').classList.toggle('active',t==='in');document.getElementById('pOut').classList.toggle('active',t==='out');}
function addTx(t){
  const amt=Number(document.getElementById(t==='in'?'inAmt':'outAmt').value);
  const desc=document.getElementById(t==='in'?'inDesc':'outDesc').value||'-';
  if(!amt||amt<=0)return alert('Masukkan jumlah');
  data[t].push({amt,desc,t:Date.now()}); save();
  document.getElementById(t==='in'?'inAmt':'outAmt').value=''; document.getElementById(t==='in'?'inDesc':'outDesc').value='';
}
function logout(){localStorage.clear();location.href='index.html'}
render();
</script>
</body>
</html>
