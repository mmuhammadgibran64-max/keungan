<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruang Data - Unlimited</title>
<style>
body{font-family:Inter,system-ui;margin:0;background:#fafafb;color:#111}
.header{position:sticky;top:0;background:#fff;border-bottom:1px solid #eee;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:10}
.logo b{color:#4f46e5}.badge{color:#16a34a;font-size:12px;font-weight:700}
.card{max-width:1000px;margin:18px auto;background:#fff;border:1px solid #eee;border-radius:16px;padding:16px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer}
.btn-primary{background:#4f46e5;color:#fff}
.btn-ghost{background:#f4f4f5}
.drop{border:2px dashed #ddd;border-radius:14px;padding:22px;text-align:center;color:#666;margin-top:12px}
.drop.drag{background:#eef2ff;border-color:#4f46e5;color:#4f46e5}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.item{background:#fff;border:1px solid #eee;border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.thumb{height:140px;background:#f6f6f7;display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.meta{padding:10px}
</style>
</head>
<body>
<div class="header"><div class="logo">ruang<b>.data</b> <span class="badge">✓ UNLIMITED • Bebas Ukuran</span></div><a href="#" style="text-decoration:none;color:#111;border:1px solid #eee;padding:6px 12px;border-radius:20px;font-size:13px">Dashboard</a></div>

<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
<div><div style="font-weight:800;font-size:18px">Upload File Unlimited</div><div style="font-size:12px;color:#777">Video 2GB pun masuk • Langsung ke Google Drive • Tanpa batas</div></div>
<div style="display:flex;gap:8px"><button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">⬆️ Pilih File Bebas Ukuran</button><button class="btn btn-ghost" onclick="loadFiles()">🔄 Refresh</button></div>
</div>
<div id="drop" class="drop"><b>Seret file berapa pun kesini — unlimited</b><div style="font-size:12px;margin-top:4px">1MB, 100MB, 1GB semua bisa</div></div>
<input id="fileInput" type="file" multiple hidden>
<div style="margin-top:14px"><input id="search" placeholder="Cari..." style="width:100%;padding:10px 12px;border:1px solid #e5e7eb;border-radius:10px"></div>
<div id="fileList" style="margin-top:16px"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx7J03Jf8foZnjh3YUUqtsiEgTUpbWf-wrXcCm7RDnYKVYoEgAEtkbnxEbefDbb2hIH/exec"; // PROXY MODE
const FOLDER_NAME = "Ruang Data Khusus";

// --- LOAD pakai JSONP biar anti CORS & cepat ---
function loadFiles(){
  const box=document.getElementById('fileList'); box.innerHTML='<div style="padding:20px;color:#888">Memuat...</div>';
  const cb='cb_'+Date.now();
  window[cb]=function(res){
    cleanup();
    if(!res || !res.ok){ box.innerHTML='<div style="padding:20px">Gagal memuat: '+(res?res.error:'no response')+'</div>'; return; }
    render(res.files||[]);
  };
  function cleanup(){ delete window[cb]; document.getElementById('jsonp')?.remove(); }
  let s=document.createElement('script'); s.id='jsonp'; s.src=SCRIPT_URL+'?action=list&callback='+cb+'&_='+Date.now();
  s.onerror=function(){ cleanup(); box.innerHTML='<div style="padding:20px">Error koneksi - klik Refresh</div>'; };
  document.body.appendChild(s);
  setTimeout(()=>{ if(document.getElementById('jsonp')){ cleanup(); box.innerHTML='<div style="padding:20px">Timeout - server lambat, klik Refresh lagi</div>'; } }, 8000);
}
function render(files){
  const box=document.getElementById('fileList'); 
  if(!files.length){ box.innerHTML='<div style="text-align:center;padding:30px;color:#888">Belum ada file</div>'; return; }
  let html='<div class="grid">';
  files.forEach(f=>{
    const isImg=(f.type||'').startsWith('image/');
    const thumb=f.thumb || ('https://lh3.googleusercontent.com/d/'+f.id);
    const th=isImg?`<img src="${thumb}" loading="lazy" onerror="this.onerror=null;this.src='https://drive.google.com/thumbnail?id=${f.id}&sz=w400'">`:`<div style="font-size:36px">${(f.type||'').includes('video')?'🎬':'📄'}</div>`;
    html+=`<div class="item"><div class="thumb" onclick="window.open('${f.viewUrl}','_blank')" style="cursor:pointer">${th}</div><div class="meta"><div style="font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${f.name}</div><div style="font-size:11px;color:#888">${(f.size/1024/1024).toFixed(2)} MB</div><div style="display:flex;gap:6px;margin-top:8px"><a href="${f.downloadUrl}" target="_blank" style="flex:1;text-align:center;background:#111;color:#fff;padding:6px;border-radius:8px;text-decoration:none;font-size:12px">Download</a><button onclick="hapus('${f.id}')" style="background:#fff1f2;color:#e11d48;border:1px solid #fecdd3;padding:6px 8px;border-radius:8px;font-size:12px;cursor:pointer">Hapus</button></div></div></div>`;
  });
  html+='</div>'; box.innerHTML=html;
  // filter
  const q=document.getElementById('search'); if(q){ q.oninput=(e)=>{ const v=e.target.value.toLowerCase(); document.querySelectorAll('.item').forEach(el=>{ el.style.display=el.textContent.toLowerCase().includes(v)?'':'none'; }); }; }
}
async function hapus(id){
  if(!confirm('Hapus file?')) return;
  const fd=new FormData(); fd.append('action','deleteFile'); fd.append('fileId',id);
  const r=await fetch(SCRIPT_URL,{method:'POST',body:fd}); const j=await r.json(); if(j.ok) loadFiles(); else alert(j.error);
}

// --- UPLOAD UNLIMITED pakai gapi (langsung ke Drive, bypass 50MB) ---
let token=null;
async function getToken(){
  if(token) return token;
  return new Promise((resolve,reject)=>{
    if(!window.gapi){ let s=document.createElement('script'); s.src='https://apis.google.com/js/api.js'; s.onload=init; document.body.appendChild(s); } else init();
    function init(){ gapi.load('client:auth2', async()=>{
      await gapi.client.init({clientId:'', scope:'https://www.googleapis.com/auth/drive', discoveryDocs:["https://www.googleapis.com/discovery/v1/apis/drive/v3/rest"]});
      // pakai token dari Apps Script
      fetch(SCRIPT_URL+'?action=debug').then(r=>r.text()).then(()=>{}).catch(()=>{});
      // ambil token via google auth popup? fallback pakai Apps Script token via server
      // Untuk unlimited tanpa batas, kita minta token dari user via gapi.auth2 (akan popup sekali)
      const auth = gapi.auth2.getAuthInstance();
      if(!auth.isSignedIn.get()){ await auth.signIn(); }
      token = auth.currentUser.get().getAuthResponse().access_token;
      resolve(token);
    });}
  });
}
// Simpler direct upload tanpa gapi sign-in: pakai resumable upload dengan token dari Apps Script (kita ambil dari ScriptApp.getOAuthToken via action=token)
async function getServerToken(){
  return new Promise(res=>{
    const cb='t_'+Date.now(); window[cb]=d=>{ delete window[cb]; document.getElementById('jt')?.remove(); res(d.token||''); };
    let s=document.createElement('script'); s.id='jt'; s.src=SCRIPT_URL+'?action=token&callback='+cb; document.body.appendChild(s);
    setTimeout(()=>res(''),4000);
  });
}
async function uploadFile(file){
  const box=document.getElementById('fileList'); 
  // coba pakai server token dulu
  let t = await getServerToken();
  if(!t){ alert('Token belum siap, klik Refresh lalu coba lagi'); return; }
  // buat metadata
  const metadata = {name:file.name, parents:[]};
  // get folder id dulu via list
  // upload multipart
  const form = new FormData();
  form.append('metadata', new Blob([JSON.stringify(metadata)],{type:'application/json'}));
  form.append('file', file);
  // resumable simple: pakai fetch multipart
  const url = 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,size,mimeType';
  let resp = await fetch(url,{method:'POST', headers:{'Authorization':'Bearer '+t}, body:form});
  if(!resp.ok){ const txt=await resp.text(); alert('Upload gagal: '+txt); return; }
  let data = await resp.json();
  // jadi publik biar thumbnail muncul
  await fetch('https://www.googleapis.com/drive/v3/files/'+data.id+'/permissions',{method:'POST',headers:{'Authorization':'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({role:'reader',type:'anyone'})}).catch(()=>{});
  // pindahkan ke folder Ruang Data Khusus via Apps Script move (opsional, biar rapi)
  fetch(SCRIPT_URL,{method:'POST',body:new URLSearchParams({action:'moveToFolder', fileId:data.id})});
  loadFiles();
}
document.getElementById('fileInput').onchange=e=>{ [...e.target.files].forEach(uploadFile); };
const drop=document.getElementById('drop'); drop.ondragover=e=>{e.preventDefault();drop.classList.add('drag')}; drop.ondragleave=()=>drop.classList.remove('drag'); drop.ondrop=e=>{e.preventDefault();drop.classList.remove('drag'); [...e.dataTransfer.files].forEach(uploadFile);};
loadFiles();
</script>
<script>
// tambahan endpoint token & move di Apps Script perlu, kita sudah siapkan di Kode.gs
</script>
</body>
</html>
