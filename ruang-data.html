<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruang Data - Galeri Unlimited</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:#fafafb;color:#111827;min-height:100vh}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-bottom:1px solid #e5e7eb;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;font-size:18px} .logo span{color:#6366f1}
.container{max-width:1100px;margin:0 auto;padding:18px}
.top{background:#fff;border:1px solid #eef0f3;border-radius:16px;padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.btn{height:44px;padding:0 18px;border-radius:12px;border:none;font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn-p{background:#6366f1;color:#fff;box-shadow:0 6px 18px rgba(99,102,241,.35)} .btn-s{background:#fff;border:1px solid #e5e7eb;color:#111827}
.drop{border:2px dashed #d1d5db;border-radius:16px;padding:22px;text-align:center;background:#fff;margin-top:14px;cursor:pointer;transition:.2s}
.drop.drag{border-color:#6366f1;background:#eef2ff}
.white-box{background:#fff;border:1px solid #eef0f3;border-radius:16px;padding:14px;margin-top:14px;min-height:380px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1;min-width:180px;height:42px;padding:0 14px;border:1px solid #e5e7eb;border-radius:10px;background:#f9fafb}
.chip{padding:7px 14px;border-radius:999px;border:1px solid #e5e7eb;background:#fff;font-size:12px;font-weight:600;cursor:pointer}
.chip.active{background:#111827;color:#fff;border-color:#111827}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.card{background:#fff;border:1px solid #eef0f3;border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.thumb{aspect-ratio:1/1;background:#f3f4f6;display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.info{padding:10px 12px}.name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:11px;color:#6b7280;margin-top:2px}
.actions{display:flex;gap:6px;padding:10px 12px;border-top:1px solid #f3f4f6}
.btn-sm{flex:1;height:32px;border-radius:8px;border:none;font-size:11px;font-weight:700;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center}
.btn-down{background:#111827;color:#fff}.btn-del{background:#fff;color:#ef4444;border:1px solid #fee2e2}
.empty{text-align:center;padding:70px 20px;color:#9ca3af}
</style>
</head>
<body>
<header>
<div class="logo">ruang<span>.data</span> <small style="color:#6b7280;font-weight:500;font-size:11px;margin-left:6px">UNLIMITED - NEW LINK</small></div>
<a href="dashboard.html" style="text-decoration:none;font-size:12px;font-weight:700;padding:8px 14px;background:#fff;border:1px solid #e5e7eb;border-radius:10px;color:#111827">Dashboard</a>
</header>
<div class="container">
<div class="top">
<div><div style="font-weight:800;font-size:15px">Upload File Baru</div><div style="font-size:12px;color:#6b7280;margin-top:2px">Foto, Video, PDF, Excel • Max 10MB • Masuk Google Drive • TANPA garis hitam</div><div id="upStatus" style="font-size:12px;font-weight:800;color:#6366f1;margin-top:6px"></div></div>
<div style="display:flex;gap:8px"><button class="btn btn-p" onclick="document.getElementById('fileInput').click()">⬆️ Pilih & Upload File</button><button class="btn btn-s" onclick="loadFiles()">🔄 Refresh</button></div>
</div>
<label class="drop" id="dropZone"><input type="file" id="fileInput" multiple hidden><div style="font-weight:700;font-size:14px">Atau seret file kesini</div><div style="font-size:12px;color:#6b7280;margin-top:4px">Drop langsung — file akan muncul di kotak putih di bawah</div></label>
<div class="white-box">
<div class="toolbar"><input id="q" class="search" placeholder="Cari di kotak putih ini..." oninput="renderFiles()"><button class="chip active" id="cAll" onclick="setFilter('all')">Semua</button><button class="chip" id="cImg" onclick="setFilter('image')">Foto</button><button class="chip" id="cVid" onclick="setFilter('video')">Video</button><button class="chip" id="cDoc" onclick="setFilter('other')">Dokumen</button><span id="count" style="margin-left:auto;font-size:12px;font-weight:700;color:#6b7280"></span></div>
<div id="grid" class="grid"><div class="empty">Belum ada file<br><small>Upload foto / video / file keuangan, akan muncul di kotak putih ini</small></div></div>
</div>
<iframe name="up_iframe" id="up_iframe" style="display:none"></iframe>
</div>
<script>
var SCRIPT_URL='https://script.google.com/macros/s/AKfycbwLHen26S3ngDrZf3FtwW3XoXlH0ct0zjWiOrEd_Z--V8iTNf9ucaVuuAbeKiLR4qLD/exec';
var $=function(id){return document.getElementById(id);};
var files=[],filter='all';
function cbList(arr){files=Array.isArray(arr)?arr:[];renderFiles();}
function loadFiles(){var s=document.createElement('script');s.src=SCRIPT_URL+'?action=listFiles&callback=cbList&t='+Date.now();document.querySelectorAll('script[data-j]').forEach(function(x){x.remove()});s.setAttribute('data-j','1');s.onerror=function(){alert('Gagal load, cek deployment Anyone');};document.body.appendChild(s);$('upStatus').textContent='Memuat...';setTimeout(function(){$('upStatus').textContent='';},1000);}
function setFilter(t){filter=t;document.querySelectorAll('.chip').forEach(function(c){c.classList.remove('active')});document.getElementById(t==='all'?'cAll':t==='image'?'cImg':t==='video'?'cVid':'cDoc').classList.add('active');renderFiles();}
function renderFiles(){var q=($('q').value||'').toLowerCase();var list=files.slice();if(filter==='image')list=list.filter(function(f){return (f.type||'').indexOf('image')!==-1});else if(filter==='video')list=list.filter(function(f){return (f.type||'').indexOf('video')!==-1});else if(filter==='other')list=list.filter(function(f){var t=f.type||'';return t.indexOf('image')===-1&&t.indexOf('video')===-1});if(q)list=list.filter(function(f){return f.name.toLowerCase().indexOf(q)!==-1});$('count').textContent=list.length+' file';var g=$('grid');if(!list.length){g.innerHTML='<div class="empty" style="grid-column:1/-1">Belum ada file<br><small>Upload foto / video / file keuangan, akan muncul di kotak putih ini</small></div>';return;}g.innerHTML=list.map(function(f){var isImg=(f.type||'').indexOf('image')!==-1;var thumb=isImg?'<img src="'+f.viewUrl+'" loading="lazy">':'<div style="font-size:36px">'+((f.type||'').indexOf('video')!==-1?'🎬':'📄')+'</div>';return '<div class="card"><div class="thumb">'+thumb+'</div><div class="info"><div class="name" title="'+f.name+'">'+f.name+'</div><div class="meta">'+(f.size/1024).toFixed(0)+' KB</div></div><div class="actions"><a class="btn-sm btn-down" href="'+f.downloadUrl+'" target="_blank">Download</a><button class="btn-sm btn-del" onclick="delFile(\''+f.id+'\')">Hapus</button></div></div>';}).join('');}
function toDataURL(file){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=rej;r.readAsDataURL(file);});}
async function handleFiles(fileList){var arr=Array.from(fileList);if(!arr.length)return;var st=$('upStatus');for(var i=0;i<arr.length;i++){var f=arr[i];if(f.size>10*1024*1024){alert(f.name+' >10MB skip');continue;}st.textContent='Upload '+(i+1)+'/'+arr.length+': '+f.name+'...';try{var dataUrl=await toDataURL(f);var form=document.createElement('form');form.method='POST';form.action=SCRIPT_URL;form.target='up_iframe';form.style.display='none';form.enctype='text/plain';var fields={action:'uploadFile',fileName:f.name,mimeType:f.type||'application/octet-stream',fileData:dataUrl};for(var k in fields){var inp=document.createElement('input');inp.type='hidden';inp.name=k;inp.value=fields[k];form.appendChild(inp);}document.body.appendChild(form);var ifr=$('up_iframe');var p=new Promise(function(r){var done=false;var to=setTimeout(function(){if(!done){done=true;r();}},4500);ifr.onload=function(){if(!done){done=true;clearTimeout(to);r();}};});form.submit();await p;form.remove();await new Promise(function(r){setTimeout(r,700)});}catch(e){alert('Gagal '+f.name);}}st.textContent='✅ Selesai, memuat kotak putih...';setTimeout(function(){st.textContent='';loadFiles();},900);}
$('fileInput').addEventListener('change',function(e){handleFiles(e.target.files);});
var dz=$('dropZone');dz.addEventListener('dragover',function(e){e.preventDefault();dz.classList.add('drag');});dz.addEventListener('dragleave',function(){dz.classList.remove('drag')});dz.addEventListener('drop',function(e){e.preventDefault();dz.classList.remove('drag');handleFiles(e.dataTransfer.files);});
function delFile(id){if(!confirm('Hapus permanen?'))return;var form=document.createElement('form');form.method='POST';form.action=SCRIPT_URL;form.target='up_iframe';form.style.display='none';form.enctype='text/plain';[['action','deleteFile'],['fileId',id]].forEach(function(kv){var i=document.createElement('input');i.type='hidden';i.name=kv[0];i.value=kv[1];form.appendChild(i);});document.body.appendChild(form);form.submit();setTimeout(function(){form.remove();loadFiles();},1000);}
loadFiles();
</script>
</body>
</html>
