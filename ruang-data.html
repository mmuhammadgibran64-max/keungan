<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruang Data - Galeri Unlimited</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:#fafafb;color:#111827;min-height:100vh}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.8);backdrop-filter:blur(12px);border-bottom:1px solid #e5e7eb;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;font-size:18px;letter-spacing:-.5px} .logo span{color:#6366f1}
.container{max-width:1100px;margin:0 auto;padding:18px}
.drop{border:2px dashed #d1d5db;border-radius:16px;padding:28px;text-align:center;background:#fff;transition:.2s;cursor:pointer}
.drop.drag{border-color:#6366f1;background:#eef2ff}
.drop h3{font-size:16px;margin-bottom:4px} .drop p{font-size:12px;color:#6b7280}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0;align-items:center}
.search{flex:1;min-width:180px;height:42px;padding:0 14px;border:1px solid #e5e7eb;border-radius:10px;background:#fff}
.chip{padding:7px 14px;border-radius:999px;border:1px solid #e5e7eb;background:#fff;font-size:12px;font-weight:600;cursor:pointer}
.chip.active{background:#111827;color:#fff;border-color:#111827}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.card{background:#fff;border:1px solid #eef0f3;border-radius:16px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:.2s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.08)}
.thumb{aspect-ratio:1/1;background:#f3f4f6;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .icon{font-size:36px}
.info{padding:10px 12px;flex:1;display:flex;flex-direction:column;gap:2px}
.name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:11px;color:#6b7280}
.actions{display:flex;gap:6px;padding:10px 12px;border-top:1px solid #f3f4f6}
.btn{flex:1;height:32px;border-radius:8px;border:none;font-size:11px;font-weight:700;cursor:pointer}
.btn-down{background:#111827;color:#fff} .btn-del{background:#fff;color:#ef4444;border:1px solid #fee2e2}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:#9ca3af;background:#fff;border-radius:16px;border:1px dashed #e5e7eb}
.log{font-family:ui-monospace,monospace;font-size:11px;background:#111827;color:#a7f3d0;padding:10px;border-radius:10px;margin-top:12px;max-height:140px;overflow:auto;display:none}
</style>
</head>
<body>
<header>
<div class="logo">ruang<span>.data</span> <small style="font-weight:500;color:#6b7280;font-size:11px;margin-left:6px">UNLIMITED DRIVE</small></div>
<div style="display:flex;gap:8px"><a href="dashboard.html" style="text-decoration:none;font-size:12px;font-weight:700;padding:8px 12px;background:#fff;border:1px solid #e5e7eb;border-radius:10px;color:#111827">Dashboard</a></div>
</header>
<div class="container">
<label class="drop" id="dropZone">
<input type="file" id="fileInput" multiple hidden>
<h3>Seret foto, video, PDF kesini atau klik untuk pilih</h3>
<p>Support semua file • Max 10MB per file • Penyimpanan Google Drive Unlimited • Bisa dibuka di HP / iPad / Laptop lain</p>
<div id="upStatus" style="margin-top:10px;font-size:12px;font-weight:700;color:#6366f1"></div>
</label>

<div class="toolbar">
<input id="q" class="search" placeholder="Cari file... ketik nama" oninput="renderFiles()">
<button class="chip active" id="cAll" onclick="setFilter('all')">Semua</button>
<button class="chip" id="cImg" onclick="setFilter('image')">Foto</button>
<button class="chip" id="cVid" onclick="setFilter('video')">Video</button>
<button class="chip" id="cDoc" onclick="setFilter('other')">Dokumen</button>
<span id="count" style="margin-left:auto;font-size:12px;font-weight:700;color:#6b7280"></span>
<button onclick="loadFiles()" style="font-size:12px;padding:7px 10px;border-radius:8px;border:1px solid #e5e7eb;background:#fff;cursor:pointer">🔄 Refresh</button>
</div>

<div id="grid" class="grid"><div class="empty">⏳ Memuat dari Drive...</div></div>
<div id="log" class="log"></div>
<iframe name="up_iframe" id="up_iframe" style="display:none"></iframe>
</div>

<script>
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbxJ2BnTkXqqAz48JoF8Y5sl2M_I2q1XMOYBccsLFdba_viOOUeQJ8cq52kVOYOonQmj/exec';
const $=s=>document.getElementById(s);
function log(m){const el=$('log');el.style.display='block';el.textContent+=`\n[${new Date().toLocaleTimeString()}] ${m}`;el.scrollTop=el.scrollHeight;}
let files=[],filter='all';
function cbList(arr){files=Array.isArray(arr)?arr:[];log(`Loaded ${files.length} file`);renderFiles();}
function loadFiles(){log('Load JSONP...');document.querySelectorAll('script[data-j]').forEach(s=>s.remove());const s=document.createElement('script');s.dataset.j=1;s.src=SCRIPT_URL+`?action=listFiles&callback=cbList&t=${Date.now()}`;s.onerror=()=>log('Gagal load, cek deployment harus Anyone');document.body.appendChild(s);}
function setFilter(t){filter=t;document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));document.getElementById(t==='all'?'cAll':t==='image'?'cImg':t==='video'?'cVid':'cDoc').classList.add('active');renderFiles();}
function renderFiles(){
  const q=($('q').value||'').toLowerCase();let list=files;
  if(filter==='image')list=list.filter(f=>(f.type||'').includes('image'));else if(filter==='video')list=list.filter(f=>(f.type||'').includes('video'));else if(filter==='other')list=list.filter(f=>{const t=f.type||'';return !t.includes('image')&&!t.includes('video');});
  if(q)list=list.filter(f=>f.name.toLowerCase().includes(q));
  $('count').textContent=`${list.length} file`;
  const g=$('grid');
  if(!list.length){g.innerHTML=`<div class="empty">Belum ada file<br><small style="font-size:12px">Upload foto, video, PDF — otomatis bisa dibuka di perangkat lain</small></div>`;return;}
  g.innerHTML=list.map(f=>{
    const isImg=(f.type||'').includes('image');const isVid=(f.type||'').includes('video');
    const thumb=isImg?`<img src="${f.viewUrl}" loading="lazy">`:isVid?`<div class="icon">🎬</div><video src="${f.viewUrl}" style="display:none"></video>`:`<div class="icon">📄</div>`;
    return `<div class="card"><div class="thumb">${thumb}</div><div class="info"><div class="name" title="${f.name}">${f.name}</div><div class="meta">${(f.size/1024).toFixed(0)} KB • ${new Date(f.t).toLocaleDateString('id-ID')}</div></div><div class="actions"><a class="btn btn-down" href="${f.downloadUrl}" target="_blank" style="display:flex;align-items:center;justify-content:center;text-decoration:none">Download</a><button class="btn btn-del" onclick="delFile('${f.id}')">Hapus</button></div></div>`;
  }).join('');
}
function toDataURL(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});}
async function handleFiles(fileList){
  const arr=Array.from(fileList);if(!arr.length)return;const st=$('upStatus');const btn=$('dropZone');
  for(let i=0;i<arr.length;i++){const f=arr[i];if(f.size>10*1024*1024){log(`SKIP ${f.name} >10MB`);continue;}st.textContent=`Upload ${i+1}/${arr.length}: ${f.name}`;log(`Upload ${f.name}`);
    try{const dataUrl=await toDataURL(f);const form=document.createElement('form');form.method='POST';form.action=SCRIPT_URL;form.target='up_iframe';form.style.display='none';form.enctype='text/plain';const fields={action:'uploadFile',fileName:f.name,mimeType:f.type||'application/octet-stream',fileData:dataUrl};for(const k in fields){const inp=document.createElement('input');inp.type='hidden';inp.name=k;inp.value=fields[k];form.appendChild(inp);}document.body.appendChild(form);const ifr=$('up_iframe');const p=new Promise(r=>{let d=false;const to=setTimeout(()=>{if(!d){d=true;r();}},4500);ifr.onload=()=>{if(!d){d=true;clearTimeout(to);r();}};});form.submit();await p;form.remove();log(`OK ${f.name}`);await new Promise(r=>setTimeout(r,600));}catch(e){log(`ERR ${f.name}: ${e.message}`);}
  }st.textContent='✅ Selesai';setTimeout(()=>{st.textContent='';loadFiles();},1200);
}
$('fileInput').addEventListener('change',e=>handleFiles(e.target.files));
const dz=$('dropZone');dz.addEventListener('click',()=>$('fileInput').click());dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag');});dz.addEventListener('dragleave',()=>dz.classList.remove('drag'));dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('drag');handleFiles(e.dataTransfer.files);});
function delFile(id){if(!confirm('Hapus file ini permanen?'))return;log('Hapus '+id);const form=document.createElement('form');form.method='POST';form.action=SCRIPT_URL;form.target='up_iframe';form.style.display='none';form.enctype='text/plain';[['action','deleteFile'],['fileId',id]].forEach(([k,v])=>{const i=document.createElement('input');i.type='hidden';i.name=k;i.value=v;form.appendChild(i);});document.body.appendChild(form);form.submit();setTimeout(()=>{form.remove();loadFiles();},1200);}
loadFiles();
</script>
</body>
</html>
