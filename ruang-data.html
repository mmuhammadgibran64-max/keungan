<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruang Data - Unlimited</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,system-ui,sans-serif;background:#fafafb;color:#111827}header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #e5e7eb;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:800} .logo span{color:#6366f1}.container{max-width:1080px;margin:0 auto;padding:14px}.card{background:#fff;border:1px solid #eef0f3;border-radius:16px;padding:14px}.btn{height:42px;padding:0 16px;border-radius:12px;border:none;font-weight:700;cursor:pointer}.btn-p{background:#6366f1;color:#fff;box-shadow:0 6px 16px rgba(99,102,241,.3)}.btn-s{background:#fff;border:1px solid #e5e7eb}.drop{border:2px dashed #d1d5db;border-radius:14px;padding:18px;text-align:center;margin-top:12px;background:#fff}.drop.drag{border-color:#6366f1;background:#eef2ff}.white-box{background:#fff;border:1px solid #eef0f3;border-radius:16px;padding:12px;margin-top:12px;min-height:420px}.search{height:40px;border:1px solid #e5e7eb;border-radius:10px;padding:0 12px;width:100%;background:#f9fafb}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:12px}.thumb{aspect-ratio:1;background:#f3f4f6;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center}.thumb img{width:100%;height:100%;object-fit:cover}.item{border:1px solid #eef0f3;border-radius:12px;overflow:hidden;background:#fff}.empty{padding:60px 10px;text-align:center;color:#9ca3af}progress{width:100%;height:8px;border-radius:999px;margin-top:8px}</style></head>
<body>
<header><div class="logo">ruang<span>.data</span> <small style="color:#16a34a;font-weight:800;margin-left:6px">✓ UNLIMITED • Bebas Ukuran</small></div><a href="dashboard.html" style="font-size:12px;font-weight:700;text-decoration:none;padding:8px 12px;border:1px solid #e5e7eb;border-radius:10px;background:#fff;color:#111">Dashboard</a></header>
<div class="container">
<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div><b>Upload File Unlimited</b><div style="font-size:12px;color:#6b7280">Video 2GB pun masuk • Langsung ke Google Drive • Tanpa batas</div><div id="upStatus" style="font-size:12px;font-weight:800;color:#6366f1;margin-top:4px"></div><progress id="prog" value="0" max="100" style="display:none"></progress></div><div><button class="btn btn-p" onclick="document.getElementById('fileInput').click()">⬆️ Pilih File Bebas Ukuran</button> <button class="btn btn-s" onclick="loadFiles()">🔄 Refresh</button></div></div>
<label class="drop" id="dropZone"><input type="file" id="fileInput" multiple hidden><b>Seret file berapa pun kesini — unlimited</b><div style="font-size:12px;color:#6b7280">1MB, 100MB, 1GB semua bisa</div></label>
<div class="white-box"><div style="display:flex;gap:8px"><input id="q" class="search" style="flex:1" placeholder="Cari..." oninput="renderFiles()"><span id="count" style="font-size:12px;font-weight:700;color:#6b7280;align-self:center"></span></div><div id="grid" class="grid"><div class="empty">Memuat...</div></div></div>
</div>
<script>
var SCRIPT_URL='https://script.google.com/macros/s/AKfycbx7J03Jf8foZnjh3YUUqtsiEgTUpbWf-wrXcCm7RDnYKVYoEgAEtkbnxEbefDbb2hIH/exec';
var $=function(id){return document.getElementById(id)},files=[],folderId=null,token=null;
function cbToken(d){ if(d&&d.ok){ token=d.token; folderId=d.folderId; } }
function getToken(cb){ var s=document.createElement('script'); s.src=SCRIPT_URL+'?action=getToken&callback=cbToken&t='+Date.now(); s.onload=function(){ if(cb)cb(); s.remove(); }; document.body.appendChild(s); }
function cbList(a){ files=Array.isArray(a)?a:[]; if(a&&a.error){$('grid').innerHTML='<div class=empty style="color:#ef4444">'+a.error+'</div>';return;} renderFiles(); }
function loadFiles(){ var s=document.createElement('script'); s.src=SCRIPT_URL+'?action=listFiles&callback=cbList&t='+Date.now(); document.querySelectorAll('script[data-j]').forEach(function(x){x.remove()}); s.setAttribute('data-j','1'); document.body.appendChild(s); }
function renderFiles(){ var q=($('q').value||'').toLowerCase(); var list=files.slice(); if(q) list=list.filter(function(f){return f.name.toLowerCase().indexOf(q)!==-1}); $('count').textContent=list.length+' file'; var g=$('grid'); if(!list.length){g.innerHTML='<div class=empty style="grid-column:1/-1">Belum ada file<br><small>Upload bebas ukuran, langsung muncul di sini</small></div>';return;} g.innerHTML=list.map(function(f){ var isImg=(f.type||'').indexOf('image')!==-1; var thumbUrl='https://drive.google.com/thumbnail?id='+f.id+'&sz=w400'; var th=isImg?'<img src="'+thumbUrl+'" loading=lazy onerror="this.onerror=null;this.src=\'https://lh3.googleusercontent.com/d/'+f.id+'\'">':'<div style="font-size:32px">'+((f.type||'').indexOf('video')!==-1?'🎬':'📄')+'</div>'; return '<div class=item><div class=thumb>'+th+'</div><div style="padding:8px 10px"><div style="font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+f.name+'</div><div style="font-size:10px;color:#6b7280">'+(f.size/1024/1024).toFixed(2)+' MB</div></div><div style="display:flex;gap:6px;padding:8px"><a href="'+f.downloadUrl+'" target=_blank style="flex:1;text-align:center;background:#111827;color:#fff;border-radius:8px;padding:6px 0;font-size:11px;font-weight:700;text-decoration:none">Download</a><button onclick="delFile(\''+f.id+'\')" style="flex:1;background:#fff;border:1px solid #fee2e2;color:#ef4444;border-radius:8px;font-size:11px;font-weight:700">Hapus</button></div></div>';}).join('');}
async function uploadDirect(file, onProg){
  return new Promise(function(resolve, reject){
    var xhr=new XMLHttpRequest();
    var boundary='-------314159265358979323846';
    var metadata=JSON.stringify({name:file.name, parents:folderId?[folderId]:[], mimeType:file.type||'application/octet-stream'});
    var delimiter="\r\n--"+boundary+"\r\n";
    var closeDelim="\r\n--"+boundary+"--";
    var reader=new FileReader();
    reader.onload=function(e){
      var base64=e.target.result.split(',')[1];
      var multipart=delimiter+'Content-Type: application/json\r\n\r\n'+metadata+delimiter+'Content-Type: '+(file.type||'application/octet-stream')+'\r\nContent-Transfer-Encoding: base64\r\n\r\n'+base64+closeDelim;
      xhr.open('POST','https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&supportsAllDrives=true',true);
      xhr.setRequestHeader('Authorization','Bearer '+token);
      xhr.setRequestHeader('Content-Type','multipart/related; boundary="'+boundary+'"');
      xhr.upload.onprogress=function(ev){ if(ev.lengthComputable && onProg) onProg(ev.loaded/ev.total*100); };
      xhr.onload=function(){ if(xhr.status>=200&&xhr.status<300) resolve(JSON.parse(xhr.responseText)); else reject(xhr.responseText); };
      xhr.onerror=function(){ reject('network'); };
      xhr.send(multipart);
    };
    reader.readAsDataURL(file);
  });
}
async function handleFiles(list){
  var arr=Array.from(list); if(!arr.length) return;
  if(!token || !folderId){ $('upStatus').textContent='Mengambil akses Drive...'; await new Promise(function(r){ getToken(r); }); }
  var prog=$('prog'); prog.style.display='block'; prog.value=0;
  for(var i=0;i<arr.length;i++){
    var f=arr[i];
    $('upStatus').textContent='Upload '+(i+1)+'/'+arr.length+': '+f.name+' ('+(f.size/1024/1024).toFixed(1)+' MB) - UNLIMITED';
    try{
      await uploadDirect(f, function(p){ prog.value = (i/arr.length*100) + (p/arr.length); });
    }catch(e){ alert('Gagal '+f.name+': '+e); }
  }
  prog.style.display='none'; $('upStatus').textContent='✅ Selesai, refresh...'; setTimeout(function(){ $('upStatus').textContent=''; loadFiles(); },700);
}
$('fileInput').addEventListener('change',function(e){handleFiles(e.target.files);});
var dz=$('dropZone'); dz.addEventListener('dragover',function(e){e.preventDefault();dz.classList.add('drag')}); dz.addEventListener('dragleave',function(){dz.classList.remove('drag')}); dz.addEventListener('drop',function(e){e.preventDefault();dz.classList.remove('drag');handleFiles(e.dataTransfer.files);});
function delFile(id){ if(!confirm('Hapus permanen?'))return; var form=document.createElement('form'); form.method='POST'; form.action=SCRIPT_URL; form.target='_blank'; form.style.display='none'; [['action','deleteFile'],['fileId',id]].forEach(function(kv){var inp=document.createElement('input');inp.type='hidden';inp.name=kv[0];inp.value=kv[1];form.appendChild(inp);}); document.body.appendChild(form); form.submit(); setTimeout(function(){form.remove();loadFiles();},1200);}
loadFiles(); getToken();
</script>
</body></html>
