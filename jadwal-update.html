<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jadwal Update</title>
<style>body{font-family:system-ui;background:#f8fafc}header{background:#2563eb;color:#fff;padding:12px 16px;position:sticky;top:0}.container{max-width:600px;margin:16px auto;padding:0 16px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 4px 12px rgba(0,0,0,.06)}.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f1f5f9}.toggle{width:44px;height:24px;background:#e2e8f0;border-radius:999px;position:relative;cursor:pointer}.toggle.on{background:#2563eb}.toggle::after{content:'';position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;top:3px;left:3px;transition:.2s}.toggle.on::after{left:23px}input{height:34px;border:1.5px solid #e2e8f0;border-radius:8px;padding:0 8px;width:85px}</style>
</head><body>
<header><div style="max-width:600px;margin:0 auto;display:flex;justify-content:space-between"><a href="pengaturan-sistem.html" style="background:rgba(255,255,255,.2);padding:6px 12px;border-radius:8px;color:#fff;text-decoration:none;font-size:12px;font-weight:700">⬅ Pengaturan</a><b>🕒 Jadwal Update</b></div></header>
<div class="container"><div class="card"><b>Jadwal Update Sistem</b><div style="font-size:11px;color:#64748b">Senin, Rabu, Kamis, Sabtu 01.00-05.00 - Buka layar baru dari Simpan Otomatis Aktif</div></div><div class="card" id="list"></div></div>
<script>
let jadwal = JSON.parse(localStorage.getItem('jadwalUpdate')||'null') || [
{hari:'Senin', aktif:true, mulai:'01:00', selesai:'05:00'},
{hari:'Rabu', aktif:true, mulai:'01:00', selesai:'05:00'},
{hari:'Kamis', aktif:true, mulai:'01:00', selesai:'05:00'},
{hari:'Sabtu', aktif:true, mulai:'01:00', selesai:'05:00'},
{hari:'Selasa', aktif:false, mulai:'02:00', selesai:'04:00'},
{hari:'Jumat', aktif:false, mulai:'02:00', selesai:'04:00'},
{hari:'Minggu', aktif:false, mulai:'02:00', selesai:'04:00'},
];
function render(){ document.getElementById('list').innerHTML = jadwal.map((j,i)=>`<div class="row"><div style="display:flex;gap:8px;align-items:center"><div class="toggle ${j.aktif?'on':''}" onclick="jadwal[${i}].aktif=!jadwal[${i}].aktif;save()"></div><b style="width:55px">${j.hari}</b></div><div style="display:flex;gap:6px;align-items:center"><input type="time" value="${j.mulai}" onchange="jadwal[${i}].mulai=this.value;save()"><span>-</span><input type="time" value="${j.selesai}" onchange="jadwal[${i}].selesai=this.value;save()"></div></div>`).join('') + `<button onclick="saveGS()" style="width:100%;height:44px;background:#2563eb;color:#fff;border:none;border-radius:10px;font-weight:700;margin-top:12px">💾 Simpan Jadwal</button>`; }
function save(){ localStorage.setItem('jadwalUpdate', JSON.stringify(jadwal)); render(); }
async function saveGS(){ save(); const fd=new FormData(); fd.append('action','saveJadwalUpdate'); fd.append('data',JSON.stringify(jadwal)); await fetch('https://script.google.com/macros/s/AKfycbxIybV0vcBP6B0ts4vzT2jZUJNTOhNcf5MGOYJsTfPDvar1JU8syK9UmBPbftHbiZKN/exec',{method:'POST',body:fd}); alert('✅ Jadwal tersimpan ke Sheet 192eRGeW...'); }
render();
</script></body></html>
