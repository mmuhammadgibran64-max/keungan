<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laku Berapa PUBLIC</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui;background:#f8fafc}
header{background:#7c3aed;color:#fff;padding:16px;position:sticky;top:0}
.container{max-width:800px;margin:16px auto;padding:0 16px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
input{width:100%;height:42px;border:1.5px solid #e2e8f0;border-radius:8px;padding:0 10px;margin-top:4px}
label{font-size:12px;font-weight:600;color:#475569}
.row{display:flex;gap:10px;margin-bottom:10px} .row>div{flex:1}
.btn{height:42px;border:none;border-radius:8px;font-weight:700;cursor:pointer;padding:0 16px}
.btn-p{background:#7c3aed;color:#fff;flex:1}
</style></head>
<body>
<header><h3>📦 Laku Berapa - PUBLIC Sheet 1FVP...</h3><p style="font-size:12px;opacity:.9">Script ID: 1TZKfkwTMClrXdoHePqzwhT0kll10WC-04d-vOw1atUpHfA0zKSpH6TcS</p></header>
<div class="container">
<div class="card">
<div class="row"><div><label>SCRIPT_URL (paste exec url baru setelah Terapkan)</label><input id="url" value="https://script.google.com/macros/s/PASTE_EXEC_URL_BARU_DISINI/exec"></div></div>
<div class="row"><div><label>Hari Apa Laku *</label><input type="date" id="hari"></div><div><label>Laku Berapa pcs *</label><input type="number" id="qty"></div></div>
<div class="row"><div><label>Pendapatan Hari Berapa *</label><input type="number" id="pend"></div><div><label>Ket</label><input id="ket"></div></div>
<button class="btn btn-p" onclick="kirim()">Kirim</button><div id="st" style="font-size:12px;color:#7c3aed;margin-top:8px"></div>
</div>
<div class="card"><canvas id="c1"></canvas></div>
<div class="card"><canvas id="c2"></canvas></div>
<div class="card"><div id="list"></div></div>
</div>
<script>
document.getElementById('hari').valueAsDate=new Date();
let chart1,chart2,all=[];
function fmt(n){return 'Rp '+Number(n).toLocaleString('id-ID')}
function getUrl(){return document.getElementById('url').value.trim()}
async function load(){
 const url=getUrl(); if(url.includes('PASTE')){document.getElementById('list').textContent='Paste exec URL dulu di atas';return}
 try{
  const r=await fetch(url+'?action=listJualan&t='+Date.now()); const j=await r.json(); all=j.data||[]; render();
 }catch(e){document.getElementById('list').textContent='Gagal: '+e}
}
async function kirim(){
 const hari=document.getElementById('hari').value; const qty=document.getElementById('qty').value; const pend=document.getElementById('pend').value; const ket=document.getElementById('ket').value;
 if(!hari||!qty||!pend) return alert('Lengkapi hari, laku, pendapatan');
 const url=getUrl();
 document.getElementById('st').textContent='Mengirim...';
 const fd=new FormData(); fd.append('action','saveJualan'); fd.append('hari',hari); fd.append('qty',qty); fd.append('pendapatan',pend); fd.append('ket',ket);
 try{ const r=await fetch(url,{method:'POST',body:fd}); const j=await r.json(); if(!j.ok) throw j.error; document.getElementById('st').textContent='Berhasil public!'; load(); }catch(e){document.getElementById('st').textContent='Gagal: '+e; alert(e)}
}
function render(){
 const grouped={}; all.forEach(d=>{if(!grouped[d.hari]) grouped[d.hari]={qty:0,pend:0}; grouped[d.hari].qty+=d.qty; grouped[d.hari].pend+=d.pendapatan});
 const labels=Object.keys(grouped).sort(); const q=labels.map(k=>grouped[k].qty); const p=labels.map(k=>grouped[k].pend);
 if(chart1) chart1.destroy(); chart1=new Chart(document.getElementById('c1'),{type:'bar',data:{labels,datasets:[{label:'Laku',data:q,backgroundColor:'#7c3aed'}]},options:{plugins:{legend:{display:false}}}}});
 if(chart2) chart2.destroy(); chart2=new Chart(document.getElementById('c2'),{type:'line',data:{labels,datasets:[{label:'Pendapatan',data:p,borderColor:'#16a34a',fill:true}]},options:{plugins:{legend:{display:false}}}}});
 document.getElementById('list').innerHTML=all.slice().reverse().map(d=>'<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee;font-size:13px"><div><b>'+d.qty+' pcs</b> - '+fmt(d.pendapatan)+' - '+d.hari+' - '+d.ket+'</div></div>').join('')||'Kosong';
}
document.getElementById('url').addEventListener('change',load);
</script>
</body></html>
