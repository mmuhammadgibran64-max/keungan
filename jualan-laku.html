<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laku Berapa PUBLIC - AUTO FIX</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui;background:#f8fafc}
header{background:#7c3aed;color:#fff;padding:16px;position:sticky;top:0;z-index:10}
.container{max-width:800px;margin:16px auto;padding:0 16px}
.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 4px 14px rgba(0,0,0,.06)}
input{width:100%;height:44px;border:1.5px solid #e2e8f0;border-radius:10px;padding:0 12px;margin-top:4px;background:#f8fafc}
label{font-size:11px;font-weight:700;color:#475569}
.row{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap} .row>div{flex:1;min-width:140px}
.btn{height:46px;border:none;border-radius:12px;font-weight:800;cursor:pointer;padding:0 18px;display:flex;align-items:center;justify-content:center}
.btn-p{background:#7c3aed;color:#fff;flex:1}
.btn-p:disabled{background:#a78bfa}
#st{font-size:12px;margin-top:10px;padding:10px;border-radius:8px;display:none}
#st.ok{display:block;background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0}
#st.err{display:block;background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
#st.load{display:block;background:#eff6ff;color:#2563eb;border:1px solid #bfdbfe}
</style></head>
<body>
<header><div style="max-width:800px;margin:0 auto;display:flex;justify-content:space-between"><div><h3>📦 Laku Berapa - PUBLIC</h3><p style="font-size:11px">Sheet 1FVP_JzF4kcTrdlz... - FIX KIRIM</p></div><div style="text-align:right"><div id="todayBig" style="font-size:22px;font-weight:800">0</div><div style="font-size:10px">pcs hari ini</div></div></div></header>
<div class="container">
<div class="card">
<div class="row"><div><label>HARI APA LAKU *</label><input type="date" id="hari"></div><div><label>LAKU BERAPA pcs *</label><input type="number" id="qty" placeholder="1"></div></div>
<div class="row"><div><label>PENDAPATAN (Rp) *</label><input type="number" id="pend" placeholder="100000"></div><div><label>KETERANGAN</label><input id="ket" placeholder="peye kacang"></div></div>
<button class="btn btn-p" id="btnKirim" onclick="kirim()"><span id="btnTxt">🚀 KIRIM - BIAR PUBLIC</span></button>
<div id="st"></div>
<div style="margin-top:10px;font-size:10px;color:#64748b">URL: <span id="urlShow"></span> <a href="#" onclick="resetUrl();return false" style="color:#7c3aed">Ganti URL</a></div>
</div>
<div class="card"><h4 style="font-size:13px">📈 Grafik Laku Per Hari</h4><canvas id="c1" height="110"></canvas></div>
<div class="card"><h4 style="font-size:13px">📈 Grafik Pendapatan Per Hari</h4><canvas id="c2" height="110"></canvas></div>
<div class="card"><h4 style="font-size:13px">📋 Riwayat Public</h4><div id="list">Memuat...</div></div>
</div>
<script>
// GANTI INI DENGAN LINK EXEC BARU DARI PROJECT 1TZK... SETELAH DEPLOY
const NEW_EXEC_URL = ""; // contoh: https://script.google.com/macros/s/AKfycb.../exec
const OLD_EXEC_URL = "https://script.google.com/macros/s/AKfycbxJ2BnTkXqqAz48JoF8Y5sl2M_I2q1XMOYBccsLFdba_viOOUeQJ8cq52kVOYOonQmj/exec";
function getUrl(){
  let u = localStorage.getItem('laku_url_final');
  if(!u){
    u = NEW_EXEC_URL || OLD_EXEC_URL;
  }
  return u;
}
document.getElementById('urlShow').textContent = getUrl();
document.getElementById('hari').valueAsDate = new Date();
let chart1,chart2,all=[];
function fmt(n){return 'Rp '+Number(n).toLocaleString('id-ID')}
function show(type,msg){const el=document.getElementById('st'); el.className=type; el.textContent=msg; el.style.display='block'}
function resetUrl(){const u=prompt('Paste link exec baru dari Apps Script 1TZK...', getUrl()); if(u){localStorage.setItem('laku_url_final',u); location.reload();}}

async function load(){
 try{
  document.getElementById('list').textContent='Memuat...';
  const url=getUrl();
  const r=await fetch(url+'?action=listJualan&t='+Date.now());
  const j=await r.json();
  if(!j.ok) throw j.error;
  all=j.data||[]; render();
 }catch(e){document.getElementById('list').innerHTML='<span style=color:#dc2626>Gagal: '+e+'<br>Klik Ganti URL di atas dan paste link baru dari project 1TZK...</span>'}
}

async function kirim(){
 const hari=document.getElementById('hari').value; 
 const qty=document.getElementById('qty').value; 
 const pend=document.getElementById('pend').value; 
 const ket=document.getElementById('ket').value;
 if(!hari||!qty||!pend){show('err','❌ Lengkapi hari, laku, pendapatan'); return}
 const btn=document.getElementById('btnKirim'); const txt=document.getElementById('btnTxt');
 btn.disabled=true; txt.textContent='⏳ MENGIRIM...'; show('load','Menyimpan...');
 try{
  const url=getUrl();
  const fd=new FormData();
  fd.append('action','saveJualan'); // untuk kompatibel dengan kode lama
  fd.append('hari',hari);
  fd.append('qty',qty);
  fd.append('pendapatan',pend);
  fd.append('ket',ket||'-');
  const r=await fetch(url,{method:'POST',body:fd});
  const text=await r.text();
  let j;
  try{j=JSON.parse(text)}catch(ex){throw 'Response bukan JSON: '+text.substring(0,100)}
  if(!j.ok) throw j.error||'gagal simpan';
  show('ok','✅ Berhasil! '+qty+' pcs - '+fmt(pend)+' hari '+hari);
  document.getElementById('qty').value=''; document.getElementById('pend').value=''; document.getElementById('ket').value='';
  await load();
 }catch(e){show('err','❌ Gagal: '+e+' | Pastikan sudah Jalankan > setup dan Terapkan = Siapa saja di project 1TZK...')}
 btn.disabled=false; txt.textContent='🚀 KIRIM - BIAR PUBLIC';
}
function render(){
 const today=new Date().toISOString().split('T')[0];
 document.getElementById('todayBig').textContent = all.filter(d=>d.hari===today).reduce((a,b)=>a+b.qty,0);
 const g={}; all.forEach(d=>{if(!g[d.hari]) g[d.hari]={qty:0,pend:0}; g[d.hari].qty+=d.qty; g[d.hari].pend+=d.pendapatan});
 const labels=Object.keys(g).sort(); const q=labels.map(k=>g[k].qty); const p=labels.map(k=>g[k].pend);
 if(chart1) chart1.destroy(); chart1=new Chart(document.getElementById('c1'),{type:'bar',data:{labels,datasets:[{data:q,backgroundColor:'#7c3aed',borderRadius:6}]},options:{plugins:{legend:{display:false}}}}});
 if(chart2) chart2.destroy(); chart2=new Chart(document.getElementById('c2'),{type:'line',data:{labels,datasets:[{data:p,borderColor:'#16a34a',backgroundColor:'rgba(22,163,74,.15)',fill:true,tension:.4}]},options:{plugins:{legend:{display:false}}}}});
 document.getElementById('list').innerHTML=all.slice().reverse().map(d=>'<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee;font-size:13px"><div><b>'+d.qty+' pcs</b> - '+fmt(d.pendapatan)+' - '+d.hari+'<div style="font-size:11px;color:#64748b">'+(d.ket||'')+'</div></div></div>').join('')||'Kosong';
}
load();
</script>
</body></html>
